<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <!-- Gradiente de fundo diagonal azul → ciano -->
    <linearGradient id="bab-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2878c8"/>
      <stop offset="100%" stop-color="#5bc8e8"/>
    </linearGradient>
    <!-- Gradiente interno do diamante (brilho interno) -->
    <linearGradient id="bab-icon-diamond-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.60"/>
    </linearGradient>
    <!-- Gradiente das arestas do cristal (facetas) -->
    <linearGradient id="bab-icon-facet-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="bab-icon-facet-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Fundo quadrado com cantos arredondados -->
  <rect width="80" height="80" rx="18" fill="url(#bab-icon-bg)"/>

  <!-- ── DIAMANTE / CRISTAL ── -->
  <!-- Faceta superior-esquerda (topo do cristal) -->
  <path d="M40 13 L26 35 L40 30 Z" fill="url(#bab-icon-facet-left)" />
  <!-- Faceta superior-direita -->
  <path d="M40 13 L54 35 L40 30 Z" fill="url(#bab-icon-facet-right)" />

  <!-- Faceta lateral-esquerda (baixo-esquerda) -->
  <path d="M26 35 L40 62 L40 30 Z" fill="url(#bab-icon-facet-right)" />
  <!-- Faceta lateral-direita (baixo-direita) -->
  <path d="M54 35 L40 62 L40 30 Z" fill="url(#bab-icon-facet-left)" />

  <!-- Núcleo sólido do cristal (centro brilhante) -->
  <polygon points="40,18 52,34 40,28 28,34" fill="#ffffff" opacity="0.90"/>

  <!-- Linha horizontal de corte do cristal (sep topo/baixo) -->
  <line x1="27" y1="35" x2="53" y2="35" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.50"/>

  <!-- Contorno do diamante (aresta externa leve) -->
  <polygon
    points="40,13 54,35 40,62 26,35"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-opacity="0.55"
    stroke-linejoin="round"/>

  <!-- ── SPARKLE 4 PONTAS (superior-direito) ── -->
  <!-- Cruz vertical -->
  <line x1="60" y1="14" x2="60" y2="26" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cruz horizontal -->
  <line x1="54" y1="20" x2="66" y2="20" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Diagonais finas para 4 pontas elegantes -->
  <line x1="56.3" y1="16.3" x2="63.7" y2="23.7" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="63.7" y1="16.3" x2="56.3" y2="23.7" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Ponto central do sparkle -->
  <circle cx="60" cy="20" r="2" fill="#ffffff"/>

  <!-- ── PONTO PIVOT CENTRAL do diamante ── -->
  <circle cx="40" cy="30" r="2.5" fill="#ffffff"/>
</svg>
