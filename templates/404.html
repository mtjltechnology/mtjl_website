<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t.title }} | MTJL Technology</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/static/brand/mtjl-favicon.png" />
  <link rel="stylesheet" href="/static/website/mtjl.css" />
</head>
<body>
<section class="services-section" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <a href="{{ home }}"><img src="/static/brand/mtjl-technology-logo-transparent.png" alt="MTJL Technology" width="150" height="80" /></a>
  <span class="section-tag">404</span>
  <h1 class="section-title">{{ t.title }}</h1>
  <p class="section-sub">{{ t.text }}</p>
  <div class="cta-actions" style="margin-top:24px">
    <a href="{{ home }}" class="btn-primary">{{ t.home }}</a>
    <a href="{{ home }}#fale-conosco" class="btn-outline">{{ t.contact }}</a>
  </div>
</section>
</body>
</html>
